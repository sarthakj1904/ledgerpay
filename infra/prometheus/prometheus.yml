global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: ledgerpay-monolith
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['monolith:8080']

  - job_name: ledgerpay-notification-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['notification-service:8081']

  - job_name: ledgerpay-fraud-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['fraud-service:8082']
