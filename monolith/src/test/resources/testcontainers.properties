# Force Testcontainers to try the DOCKER_HOST env-var strategy first, bypassing the
# auto-detection strategies that get confused by Docker Desktop 29's control-plane proxy.
# (Note: the Docker API version is pinned via -Dapi.version=1.45 in the Surefire
#  config of monolith/pom.xml — that's the property docker-java reads, not here.)
docker.client.strategy=org.testcontainers.dockerclient.EnvironmentAndSystemPropertyClientProviderStrategy

# Disable the Ryuk cleanup container. Colima's Lima VM cannot bind-mount a Unix socket
# from the host into a container (Ryuk needs host docker.sock access), which makes Ryuk
# fail to start. Without Ryuk, containers Testcontainers starts must be cleaned up by
# the JVM shutdown hook — fine for local dev and CI. This is the documented workaround
# for using Testcontainers on Colima / Lima / Rancher Desktop.
ryuk.disabled=true
